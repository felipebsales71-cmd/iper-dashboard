<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="stylesheet" href="/styles.css" />
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				background: transparent;
			}
		</style>
	</head>
	<body data-iframe-mode="kpis">
		<section aria-label="Indicadores principais" class="kpi-grid">
			<article class="metric-card metric-blue">
				<div class="metric-card-head">
					<span>Arrecadado acumulado do ano</span>
					<i aria-hidden="true">▣</i>
				</div>
				<strong id="annualRevenueKpi">—</strong>
				<br />
				<div class="metric-footer">
					<span>Patronal + segurado</span
					><b id="annualPeriodLabel">—</b>
				</div>
			</article>
			<article class="metric-card metric-green">
				<div class="metric-card-head">
					<span>Arrecadado na competência</span>
					<i aria-hidden="true">◎</i>
				</div>
				<strong id="competenceRevenueKpi">—</strong>
				<small id="competenceRevenueNote">—</small>
				<div class="metric-footer">
					<span>Competência selecionada</span
					><b id="competenceLabel">—</b>
				</div>
			</article>
			<article class="metric-card metric-yellow">
				<div class="metric-card-head">
					<span>Quantitativo de servidores</span>
					<i aria-hidden="true">↗</i>
				</div>
				<strong id="serversKpi">—</strong>
				<small id="serversNote">—</small>
				<div class="metric-footer">
					<span>Na competência selecionada</span
					><b id="serversPeriodLabel">—</b>
				</div>
			</article>
		</section>
		<div class="tooltip" id="tooltip" role="status"></div>
		<div class="toast" id="toast" role="status" aria-live="polite"></div>
		<script src="/app.js" defer></script>
	</body>
</html>
